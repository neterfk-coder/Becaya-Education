name: becaya
description: "Becaya - calendario de becas y voluntariados para Peru"
publish_to: 'none'

# Primer número: lo que ve el usuario. Segundo: versionCode de Android,
# que solo puede subir. Ver docs/publicar.md antes de tocarlo.
#
# El versionCode (tras el "+") sube en CADA subida a Play, aunque el
# envío anterior no llegara a publicarse: la consola rechaza cualquier
# AAB que repita un número ya visto.
#
# 1.0.1 sí cambia el número visible porque esta versión trae cosas
# nuevas para el usuario: ajustes con sus datos y valoración en Play.
version: 1.0.2+4

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Descarga del catálogo publicado (data/becas.json del sitio).
  http: ^1.2.2

  # Caché del último catálogo descargado, para abrir sin conexión.
  shared_preferences: ^2.3.2

  # Abre la convocatoria oficial en el navegador del teléfono. Nunca
  # mostramos el trámite dentro de la app: el usuario tiene que ver la
  # barra de direcciones oficial antes de escribir sus datos.
  url_launcher: ^6.3.1

  # Cuenta opcional, solo para sincronizar las guardadas entre
  # dispositivos. Nada del catálogo depende de iniciar sesión.
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.2

  # Actualización desde dentro de la app (Play In-App Updates). Solo
  # funciona en builds instalados desde Google Play: en un APK puesto a
  # mano o en un emulador, la comprobación falla y se ignora.
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
